<!DOCTYPE html>

<html>

<head>
	<style>
		:root{
			background-color:rgb(135, 206, 235);
		}
		p:First-child{
			color:white;
			background-color:black;
		}
		p:nth-child(2){
			color:black;
		}
		p:last-child{
			color:red;
		}
		li{
			background-color:grey;
			width:50%;
			padding:10px;
		}
		li:nth-child(odd){
			background-color:white;
		}
		li:First-child,
		li:last-child{
			font-size:22px;
		}
		li:nth-last-child(3){
			background-color:pink;
		}
	</style>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<article>
		<p>First paragraph</p>
		<p>Second paragraph</p>
		<p>Third paragraph</p>
	</article>
	<ul>
		<li>First Item</li>
		<li>second Item</li>
		<li>Third Item</li>
		<li>Fourth Item</li>
		<li>Fifth Item</li>
	</ul>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
